name: Build development ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate configuration
        run: make check

  build:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 120
    container:
      image: debian:trixie-slim
      options: --privileged
    steps:
      - name: Prepare Debian build environment
        run: |
          apt-get update
          apt-get install --yes ca-certificates git live-build make debootstrap xorriso squashfs-tools
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build ISO
        run: make iso
      - name: Upload development image
        uses: actions/upload-artifact@v4
        with:
          name: fanne-linux-amd64
          path: |
            dist/fanne-linux-amd64.iso
            dist/fanne-linux-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7

name: Build development ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate configuration
        run: make check

  build:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /
      - name: Build ISO in Debian Sid
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:sid-slim \
            sh -ec 'apt-get update && apt-get install --yes ca-certificates git live-build make debootstrap xorriso squashfs-tools && make iso'
      - name: Upload development image
        uses: actions/upload-artifact@v4
        with:
          name: fanne-linux-amd64
          path: |
            dist/fanne-linux-amd64.iso
            dist/fanne-linux-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7

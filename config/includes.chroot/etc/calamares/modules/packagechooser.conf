# Fanne Linux extras chooser.
#
# The live/installed image ships a deliberately minimal package set (see
# config/package-lists/fanne.list.chroot). This screen lets the person
# installing add optional software on top of that minimal base instead of
# it being baked into the ISO for everyone. Nothing is preselected: leaving
# every box unchecked keeps the minimal install.
#
# method: "packages" writes GlobalStorage values that the *packages*
# job module (already present in Calamares' exec sequence for this distro)
# consumes directly -- no custom script needed. See upstream's
# src/modules/packagechooser/packagechooser.conf for the full field
# reference.
#
# CAVEAT: because these packages are NOT on the live squashfs, picking any
# of them requires a working internet connection during installation (apt
# will fetch them from the configured Devuan mirror). This is the direct
# trade-off for keeping the ISO itself smaller.
---
mode: optionalmultiple

method: packages

labels:
  step: "Extra software"

items:
  - id: office
    name: "Office suite"
    description: "LibreOffice Writer, Calc, and Impress. Needs an internet connection during install."
    packages: [libreoffice-writer, libreoffice-calc, libreoffice-impress, libreoffice-gtk3]

  - id: partitioning
    name: "Partition editor"
    description: "GParted, for resizing and managing disk partitions after install."
    packages: [gparted]

  - id: bluetooth
    name: "Bluetooth support"
    description: "Blueman, a Bluetooth device manager for the XFCE panel."
    packages: [blueman]

  - id: multimedia
    name: "Extra media apps"
    description: "Ristretto (image viewer) and Parole (video/audio player)."
    packages: [ristretto, parole]

  - id: xfce-goodies
    name: "XFCE goodies"
    description: "A handful of small XFCE add-ons: task manager, screenshot tool, clipboard manager, and a file/app search tool."
    packages: [xfce4-taskmanager, xfce4-screenshooter, xfce4-clipman-plugin, catfish]
